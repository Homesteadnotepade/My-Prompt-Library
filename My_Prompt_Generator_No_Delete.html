<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>My Prompt Library</title>
        <style>

:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1c2938;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}header{background:#142c4b;color:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}header h1{font-size:21px;margin:0}header small{color:#c8d6e8}.app{display:grid;grid-template-columns:310px minmax(0,1fr);min-height:calc(100vh - 72px)}aside{background:#fff;border-right:1px solid #dbe2ea;padding:18px;max-height:calc(100vh - 72px);overflow:auto}main{padding:26px;max-width:1100px;width:100%;margin:auto}.panel{background:#fff;border:1px solid #e0e6ee;border-radius:15px;padding:23px;box-shadow:0 3px 14px #1e355009}h2{margin:0 0 5px;font-size:25px}h3{font-size:15px;margin:20px 0 10px}.muted{color:#65758b;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.btn{border:1px solid #cbd5e1;background:#fff;color:#1c344f;border-radius:9px;padding:9px 13px;font-weight:600}.btn:hover{background:#eaf0f8}.primary{background:#2159b3;color:#fff;border-color:#2159b3}.primary:hover{background:#17478f}.danger{color:#ad2638}.input{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:11px;background:#fff;color:#1c2938}textarea.input{resize:vertical;min-height:90px;line-height:1.5}label{display:block;font-weight:650;font-size:13px;margin:14px 0 6px}.nav-group{margin-top:13px}.nav-title{width:100%;background:#edf2f8;border:0;border-radius:8px;padding:10px;text-align:left;font-weight:700;color:#29425e;display:flex;justify-content:space-between}.nav-item{display:block;width:100%;padding:9px 10px;border:0;background:none;text-align:left;border-radius:8px;color:#34475e;font-size:13px}.nav-item:hover,.nav-item.active{background:#dce9fc;color:#17478f}.tabs{display:flex;gap:6px;margin:20px 0 10px}.tabs button[aria-pressed=true]{background:#2159b3;color:#fff}.preview{white-space:pre-wrap;overflow-wrap:anywhere;background:#f1f5fa;border:1px solid #e0e6ee;border-radius:10px;padding:17px;min-height:110px;line-height:1.6;font-size:14px}.empty{padding:35px;text-align:center;color:#64748b}.hint{background:#fff7df;border:1px solid #f3dda2;padding:10px 12px;border-radius:8px;font-size:13px;margin-top:12px}.field-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:0 16px}.top-actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.modal-backdrop{position:fixed;inset:0;background:#15243c99;display:grid;place-items:center;padding:15px;z-index:5}.modal{background:white;border-radius:14px;padding:23px;width:min(660px,100%);max-height:90vh;overflow:auto}.pill{font-size:12px;background:#e8eef8;border-radius:100px;padding:5px 9px}.status{min-height:20px;color:#17613e;font-size:13px}footer{margin-top:15px;font-size:12px;color:#66788c}@media(max-width:760px){.app{display:block}aside{max-height:none;border-right:0;border-bottom:1px solid #dbe2ea}main{padding:14px}.panel{padding:16px}header{padding:14px}header h1{font-size:18px}}
</style>
</head>
<body>
    <header>
        <div>
            <h1>✦ My Prompt Library</h1>
            <small>Choose · Customize · Copy</small>
            </div><span id="totalHeader" class="pill" style="color:#142c4b">28 prompts</span>
            </header>
            <div class="app">
                <aside>
                    <input id="search" class="input" placeholder="Search prompts, categories..." aria-label="Search prompts">
                    <div class="row" style="margin-top:12px">
                        <button id="allBtn" class="btn primary">All prompts</button>
                        <button id="favBtn" class="btn">★ Favorites</button>
                        </div>
                        <div id="nav"></div>
                        <hr style="border:0;border-top:1px solid #e2e8f0;margin:20px 0">
                        <button class="btn primary" id="addBtn" style="width:100%">+ Add New Prompt</button>
                        <div class="row" style="margin-top:10px">
                            <button class="btn" id="exportBtn">Export backup</button>
                            <button class="btn" id="importBtn">Import backup</button>
                            <input type="file" id="fileImport" accept=".json,application/json" hidden>
                            </div>
                            <footer>Prompts and favorites are saved in this browser. Export a backup regularly.</footer>
                </aside>
                <main>
                    <section class="panel" id="workspace">
                        <div id="detail">
                        </div></section><footer>Offline-ready · No account required · Your text stays in this browser unless you copy or export it.</footer></main></div><div id="modalHost"></div><script>
'use strict';const SEED=[{"id": "p1", "title": "Rewrite it Like a real person", "body": "You are an editor with a sharp eye for writing that sounds constructed instead of spoken. Rewrite this the way someone who actually lived through the experience would say it: a little rougher, more direct, and more natural. Cut anything that feels rehearsed, exaggerated, or written to impress. Make it sound authentic, conversational, and genuinely human. Text: [Text to rewrite]", "category": "Writing & Editing", "collection": "", "favorite": false}, {"id": "p2", "title": "Fix the flow of Thought", "body": "This isn't a grammar edit, it's a thinking edit. Rewrite this so the idea flows the way a real person's mind does: sometimes fast, sometimes slow, sometimes messy, sometimes precise, Vary the rhythm naturally, break any patterns that make the writing feel overly controlled or artificial, and make it sound like genuine human thought instead of polished AI text. Text: [Text to rewrite]", "category": "Writing & Editing", "collection": "", "favorite": false}, {"id": "p3", "title": "Pattern Breaker", "body": "You are an expert at spotting the subtle patterns that make writing sound AI-generated. Go through this text and remove those patterns one by one. Vary the sentence structure, soften anything that feels rigid or formulaic, and make every word feel naturally chosen in the moment rather than produced by a template. The result should read like authentic human writing with a natural flow. Text: [Text to rewrite]", "category": "Writing & Editing", "collection": "", "favorite": false}, {"id": "p4", "title": "Voice Builder", "body": "You are shaping a writing style that sounds like it belongs to a real person. Rewrite this so it has a clear point of view instead of the neutral tone of someone trying to please everyone. Let genuine opinions, subtle contradictions, and natural shifts in tone come through. The result should feel personal, confident, and unmistakably human, not polished into sounding generic. Text: [Text to rewrite]", "category": "Writing & Editing", "collection": "", "favorite": false}, {"id": "p5", "title": "Make it hit hard", "body": "Rewrite this with one goal: make it impossible to ignore. Keep the core message, but cut anything that feels weak, overthought, or forgettable. Every sentence should carry weight, every word should earn its place, and the writing should sound like it comes from someone who genuinely cares about what they're saying. Text: [Text to rewrite]", "category": "Writing & Editing", "collection": "", "favorite": false}, {"id": "p6", "title": "The Credibility Test", "body": "You are a skeptical reader who immediately notices writing that feels too polished or artificial. Go through this text sentence by sentence and rewrite anything that sounds overly constructed, over-edited, or unnaturally precise. Make it sound like something a real person would actually say out loud: natural, believable, and effortless, without feeling forced: Text: [Text to rewrite]", "category": "Writing & Editing", "collection": "", "favorite": false}, {"id": "p7", "title": "Expert-Level Insights", "body": "Act as a top [industry] professional. Analyze [problem/situation] and give me a solution using expert-level strategies.", "category": "Business & Strategy", "collection": "", "favorite": false}, {"id": "p8", "title": "Reverse Engineering Success", "body": "Break down how [successful person/company] achieved [specific goal]. Identify the key steps I can apply to my own situation.", "category": "Business & Strategy", "collection": "", "favorite": false}, {"id": "p9", "title": "AI Research Assistant", "body": "Find the most recent and credible sources on [topic] and summarize the key insights for me.", "category": "Research & Analysis", "collection": "", "favorite": false}, {"id": "p10", "title": "Meeting Notes to Action Items", "body": "Here’s a meeting transcript: [paste text]. Turn it into a summary with key decisions, action it", "category": "Productivity", "collection": "", "favorite": false}, {"id": "p11", "title": "SEO-Optimized Blog Posts", "body": "Write a 1,000-word blog post on [topic], optimized for SEO, with engaging hooks and a strong call to action.", "category": "Writing & Editing", "collection": "", "favorite": false}, {"id": "p12", "title": "Social Media Content Machine", "body": "Create 5 viral tweet hooks or Instagram captions for [topic] based on current trends.", "category": "Writing & Editing", "collection": "", "favorite": false}, {"id": "p13", "title": "Contract & Policy Generator", "body": "Draft a professional [contract, privacy policy, terms of service] for a [business type] with clear legal language.", "category": "Documents & Policies", "collection": "", "favorite": false}, {"id": "p14", "title": "Quick Data Analysis", "body": "Analyze this dataset: [insert data]. Identify key trends, outliers, and actionable insights.", "category": "Research & Analysis", "collection": "", "favorite": false}, {"id": "p15", "title": "AI-Powered Learning Plan", "body": "Create a 30-day structured learning plan to master [skill], including exercises and milestone goals.", "category": "Learning & Skills", "collection": "", "favorite": false}, {"id": "p16", "title": "Blue Ocean Strategy", "body": "ChatGPT, how can I identify and exploit a Blue Ocean in [Your Industry] by offering something unique?", "category": "Business & Strategy", "collection": "Prompts to make you rich", "favorite": false}, {"id": "p17", "title": "Moat analysis", "body": "ChatGPT, help me outline a moat for my [Product/Service] that will fend off competitors by focusing on [Unique Value Proposition].", "category": "Business & Strategy", "collection": "Prompts to make you rich", "favorite": false}, {"id": "p18", "title": "SWOT analysis", "body": "ChatGPT, conduct a SWOT analysis for [Your Business/Project] to identify areas of growth and improvement.", "category": "Business & Strategy", "collection": "Prompts to make you rich", "favorite": false}, {"id": "p19", "title": "The Eisenhower Matrix", "body": "ChatGPT, help me organize my tasks using the Eisenhower Matrix for [Today/This Week] to maximize output.", "category": "Productivity", "collection": "Prompts to make you rich", "favorite": false}, {"id": "p20", "title": "Porter's five forces", "body": "ChatGPT, analyze [Your Industry] using Porter's Five Forces to uncover strategic positions.", "category": "Business & Strategy", "collection": "Prompts to make you rich", "favorite": false}, {"id": "p21", "title": "Jobs-to-be-done", "body": "ChatGPT, help me identify the core jobs-to-be-done for [Target Audience] in [Your Industry].", "category": "Business & Strategy", "collection": "Prompts to make you rich", "favorite": false}, {"id": "p22", "title": "Product by Martket fit", "body": "ChatGPT, what steps can I take to achieve a tighter product-market fit for [Your Product]?", "category": "Business & Strategy", "collection": "Prompts to make you rich", "favorite": false}, {"id": "p23", "title": "Use the 80/20 principle to learn faster than ever", "body": "I want to learn about [insert topic]. Identify and share the most important 20% of learnings from this topic that will help me understand 80% of it.", "category": "Learning & Skills", "collection": "Prompts that feel illegal", "favorite": false}, {"id": "p24", "title": "Learn and develop any new skill in 30 days", "body": "I want to learn / get better at [insert desired skill]. I am a complete beginner. Create a 30 day learning plan that will help a beginner like me learn and improve this skill.", "category": "Learning & Skills", "collection": "Prompts that feel illegal", "favorite": false}, {"id": "p25", "title": "Enhance your problem solving skills", "body": "Your role is that of a problem solver. Give me a step-by-step guide to solving [insert your problem].", "category": "Learning & Skills", "collection": "Prompts that feel illegal", "favorite": false}, {"id": "p26", "title": "Use stories and metaphors to aid your memory", "body": "I am currently learning about [insert topic]. Convert the key lessons from this topic into engaging stories and metaphors to aid my memorization.", "category": "Learning & Skills", "collection": "Prompts that feel illegal", "favorite": false}, {"id": "p27", "title": "Strengthen your learning by testing yourself", "body": "I am currently learning about [insert topic]. Ask me a series of questions that will test my knowledge. Identify knowledge gaps in my answers and give me better answers to fill those gaps.", "category": "Learning & Skills", "collection": "Prompts that feel illegal", "favorite": false}, {"id": "p28", "title": "Generate new ideas and overcome writers block", "body": "I am writing a blog post about [insert topic]. Give me an outline for this blog post with 10 bullet points. Also give me 5 options for a catchy headline.", "category": "Creative Ideas", "collection": "Prompts that feel illegal", "favorite": false}];const KEY='prompt-library-v1';let library;try{const stored=JSON.parse(localStorage.getItem(KEY));library=Array.isArray(stored)&&stored.every(p=>p&&typeof p.title==='string'&&typeof p.body==='string')?stored:structuredClone(SEED)}catch{library=structuredClone(SEED)}let selected=library[0]?.id||null,search='',favoritesOnly=false,collapsed=new Set(),values={},direct=false,directText='',status='';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const placeholders=s=>[...new Set([...s.matchAll(/\[([^\]\n]+)\]/g)].map(x=>x[1]))];function save(){try{localStorage.setItem(KEY,JSON.stringify(library))}catch{alert('Browser storage is unavailable or full. Export a backup to protect your prompts.')}}function active(){return library.find(p=>p.id===selected)}function build(){const p=active();if(!p)return '';return p.body.replace(/\[([^\]\n]+)\]/g,(match,k)=>values[k]?.trim()?values[k]:match)}function refreshNav(){const q=search.trim().toLowerCase();const items=library.filter(p=>(!favoritesOnly||p.favorite)&&[p.title,p.body,p.category,p.collection].join(' ').toLowerCase().includes(q));const cats=[...new Set(items.map(p=>p.category||'Uncategorized'))].sort();$('nav').innerHTML=cats.map(c=>{const ps=items.filter(p=>(p.category||'Uncategorized')===c);return `<div class="nav-group"><button class="nav-title" data-cat="${esc(c)}">${collapsed.has(c)?'▸':'▾'} ${esc(c)} <span>${ps.length}</span></button>${collapsed.has(c)?'':ps.map(p=>`<button class="nav-item ${p.id===selected?'active':''}" data-id="${esc(p.id)}">${p.favorite?'★ ':''}${esc(p.title)}</button>`).join('')}</div>`}).join('')||'<p class="muted">No matching prompts.</p>';$('totalHeader').textContent=library.length+' prompts';$('allBtn').classList.toggle('primary',!favoritesOnly);$('favBtn').classList.toggle('primary',favoritesOnly)}function select(id){selected=id;values={};direct=false;directText='';status='';refreshNav();render()}function render(){const p=active();if(!p){$('detail').innerHTML='<div class="empty">No prompts yet. Select Add New Prompt to begin.</div>';return}const fields=placeholders(p.body);$('detail').innerHTML=`<div class="row space"><span class="pill">${esc(p.category||'Uncategorized')}</span><div class="top-actions"><button class="btn" id="starBtn">${p.favorite?'★ Favorited':'☆ Favorite'}</button><button class="btn" id="editBtn">Edit prompt</button></div></div><h2 style="margin-top:15px">${esc(p.title)}</h2>${p.collection?`<p class="muted">Original collection: ${esc(p.collection)}</p>`:''}${p.title==='Meeting Notes to Action Items'?'<div class="hint">This original prompt appears to end mid-sentence (“action it”). You can correct it using Edit prompt.</div>':''}<div class="tabs"><button class="btn ${!direct?'primary':''}" id="fieldsTab" aria-pressed="${!direct}">Fill in fields</button><button class="btn ${direct?'primary':''}" id="directTab" aria-pressed="${direct}">Edit directly</button></div><div id="fieldArea" class="${direct?'hidden':''}">${fields.length?`<p class="muted">Fill in the blanks below. Unfilled placeholders remain visible in the preview.</p><div class="field-grid">${fields.map((f,i)=>`<div><label for="field${i}">${esc(f)}</label>${/text|data|problem|situation|transcript/i.test(f)?`<textarea class="input" rows="4" id="field${i}" data-field="${esc(f)}" placeholder="Enter ${esc(f)}..."></textarea>`:`<input class="input" id="field${i}" data-field="${esc(f)}" placeholder="Enter ${esc(f)}...">`}</div>`).join('')}</div>`:'<p class="muted">This prompt is ready to copy. You can also edit it directly.</p>'}</div><div id="directArea" class="${direct?'':'hidden'}"><label for="directInput">Editable completed prompt</label><textarea class="input" id="directInput" rows="10"></textarea></div><h3>Live prompt preview</h3><div class="preview" id="preview"></div><div class="row" style="margin-top:16px"><button class="btn primary" id="copyBtn">⧉ Copy Complete Prompt</button><button class="btn" id="resetBtn">↺ Reset</button></div><p id="status" class="status" aria-live="polite"></p>`;document.querySelectorAll('[data-field]').forEach(el=>{el.value=values[el.dataset.field]||'';el.addEventListener('input',()=>{values[el.dataset.field]=el.value;updatePreview()})});$('directInput').value=directText;$('directInput').addEventListener('input',e=>{directText=e.target.value;updatePreview()});$('fieldsTab').onclick=()=>{direct=false;render()};$('directTab').onclick=()=>{if(!direct)directText=build();direct=true;render()};$('starBtn').onclick=()=>{p.favorite=!p.favorite;save();refreshNav();render()};$('editBtn').onclick=()=>openEditor(p);$('copyBtn').onclick=async()=>{const text=direct?directText:build();try{await navigator.clipboard.writeText(text);status='Copied to clipboard.'}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();try{status=document.execCommand('copy')?'Copied to clipboard.':'Copy was blocked. Select the preview text and copy manually.'}catch{status='Copy was blocked. Select the preview text and copy manually.'}t.remove()}$('status').textContent=status};$('resetBtn').onclick=()=>{values={};direct=false;directText='';render()};updatePreview()}function updatePreview(){$('preview').textContent=direct?directText:build();$('status').textContent=status}function openEditor(p){const creating=!p;const x=p||{title:'',category:'',body:'',collection:''};$('modalHost').innerHTML=`<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${creating?'Add':'Edit'} prompt"><h2>${creating?'Add New Prompt':'Edit Prompt'}</h2><form id="editForm"><label for="ptitle">Prompt title</label><input class="input" id="ptitle" required value="${esc(x.title)}"><label for="pcat">Category</label><input class="input" id="pcat" list="categories" required value="${esc(x.category)}"><datalist id="categories">${[...new Set(library.map(p=>p.category))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist><label for="pcollection">Original collection (optional)</label><input class="input" id="pcollection" value="${esc(x.collection)}"><label for="pbody">Prompt text — use [brackets] for input fields</label><textarea class="input" id="pbody" rows="9" required></textarea><div class="row" style="margin-top:15px"><button class="btn primary" type="submit">Save Prompt</button><button class="btn" type="button" id="cancelEdit">Cancel</button></div></form></div></div>`;$('pbody').value=x.body;$('cancelEdit').onclick=()=>{$('modalHost').innerHTML=''};$('editForm').onsubmit=e=>{e.preventDefault();const obj={title:$('ptitle').value.trim(),category:$('pcat').value.trim(),collection:$('pcollection').value.trim(),body:$('pbody').value};if(!obj.title||!obj.category||!obj.body.trim())return;if(creating){obj.id='p'+Date.now()+'-'+Math.random().toString(36).slice(2,7);obj.favorite=false;library.push(obj)}else Object.assign(p,obj);save();$('modalHost').innerHTML='';select(creating?obj.id:p.id)}}$('search').oninput=e=>{search=e.target.value;refreshNav()};$('nav').onclick=e=>{const id=e.target.closest('[data-id]');const cat=e.target.closest('[data-cat]');if(id)select(id.dataset.id);else if(cat){const c=cat.dataset.cat;collapsed.has(c)?collapsed.delete(c):collapsed.add(c);refreshNav()}};$('allBtn').onclick=()=>{favoritesOnly=false;refreshNav()};$('favBtn').onclick=()=>{favoritesOnly=true;refreshNav()};$('addBtn').onclick=()=>openEditor(null);$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(library,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-prompt-library-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};$('importBtn').onclick=()=>$('fileImport').click();$('fileImport').onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||!data.every(p=>p&&typeof p.title==='string'&&typeof p.body==='string'&&typeof p.category==='string'))throw Error('Invalid prompt backup');if(!confirm('Replace your current library with '+data.length+' imported prompts? Export a backup first if needed.'))return;library=data.map((p,i)=>({id:'import'+i+'-'+Date.now(),title:p.title,body:p.body,category:p.category,collection:typeof p.collection==='string'?p.collection:'',favorite:!!p.favorite}));save();select(library[0]?.id||null)}catch(err){alert('Unable to import: '+err.message)}finally{e.target.value=''}};refreshNav();render();
</script>
</body>
</html>
